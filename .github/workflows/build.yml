name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Clean native folders
        run: rm -rf android ios
      - name: Expo Prebuild
        run: npx expo prebuild --platform android
      - name: Fix missing splashscreen color
        run: mkdir -p android/app/src/main/res/values && echo '<resources><color name="splashscreen_background">#000000</color></resources>' > android/app/src/main/res/values/colors.xml
      - name: Increase Gradle Memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AscendApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
